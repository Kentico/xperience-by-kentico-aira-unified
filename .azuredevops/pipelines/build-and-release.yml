name: "$(Build.DefinitionName) #$(Build.BuildId)"

trigger: none # Manual Publish
pr: none # GitHub Actions handle PRs

pool:
  vmImage: 'windows-latest'

resources:
  repositories:
    - repository: self
      type: git

variables:
  - name: SIGN_FILE
    value: true

stages:
  - stage: Build
    jobs:
      - job: Build
        displayName: Build, Sign, and Pack

        variables:
          - group: Code Sign KV Auth

          - name: Configuration
            value: Release

          - name: ProjectPath
            value: src/Kentico.Xperience.AiraUnified/Kentico.Xperience.AiraUnified.csproj

        steps:
          - task: UseNode@1
            displayName: Use Node 20.10
            inputs:
              version: 20.10
              checkLatest: true
              
          - task: Npm@1
            displayName: npm run ci
            inputs:
              command: custom
              workingDir: $(System.DefaultWorkingDirectory)/src/Kentico.Xperience.AiraUnified/FrontEnd
              customCommand: ci --no-audit --no-fund 

          - task: Npm@1
            displayName: npm run build
            inputs:
              command: custom
              workingDir: $(System.DefaultWorkingDirectory)/src/Kentico.Xperience.AiraUnified/FrontEnd
              customCommand: run build 

          - task: Npm@1
            displayName: npm run build-css
            inputs:
              command: custom
              workingDir: $(System.DefaultWorkingDirectory)/src/Kentico.Xperience.AiraUnified/FrontEnd
              customCommand: run build-css
        
          - task: DotNetCoreCLI@2
            displayName: Restore dotnet tools
            inputs:
              command: custom
              custom: tool
              arguments: restore
              workingDirectory: $(System.DefaultWorkingDirectory)

          - task: DotNetCoreCLI@2
            displayName: Restore dependencies
            inputs:
              command: restore
              projects: ${{ variables.ProjectPath }}
              feedsToUse: select
              restoreArguments: --locked-mode

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: ${{ variables.ProjectPath }}
              configuration: ${{ variables.Configuration }}
              arguments: --no-restore
            env:
              AuthenticodeClientSecret: $(AuthenticodeClientSecret)
              # Roll-forward behavior set for AzureSignTool dotnet tool (see .config\dotnet-tools.json) which requires .Net 6.0 runtime
              DOTNET_ROLL_FORWARD: Major

          - task: DotNetCoreCLI@2
            displayName: Create NuGet package
            inputs:
              command: pack
              packagesToPack: ${{ variables.ProjectPath }}
              configuration: ${{ variables.Configuration }}
              packDirectory: $(System.DefaultWorkingDirectory)/packages
              includesymbols: true
              nobuild: true
              versioningScheme: off

          - publish: $(System.DefaultWorkingDirectory)/packages
            displayName: Publish NuGet package as artifact
            artifact: artifact

  - ${{ if eq(variables['Build.SourceBranch'], 'refs/heads/main') }}:
      - stage: PublishNuGetPackages
        displayName: Publish NuGet packages
        dependsOn: Build

        jobs:
          - deployment: PublishNuGetPackages
            displayName: Publish NuGet packages

            environment: integrations-release-nuget
            strategy:
              runOnce:
                deploy:
                  steps:
                    - checkout: none

                    - task: NuGetToolInstaller@1
                      displayName: Install latest nuget.exe
                      inputs:
                        versionSpec: ">=5.6"
                        checkLatest: true

                    - task: NuGetAuthenticate@1
                      displayName: NuGet Authenticate

                    - task: NuGetCommand@2
                      displayName: NuGet push
                      inputs:
                        command: push
                        packagesToPush: $(Pipeline.Workspace)/artifact/*.nupkg
                        nuGetFeedType: external
                        publishFeedCredentials: nuget.org
                        allowPackageConflicts: true
